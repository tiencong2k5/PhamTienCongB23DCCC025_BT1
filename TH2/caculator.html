<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Máy tính đơn giản</title>
<style>
  :root{
    --nen-trang: #ece4d6;
    --vo-may: #2b2a28;
    --vo-may-toi: #201f1d;
    --man-hinh: #1c1b19;
    --chu-man-hinh: #e8c477;
    --nut-so: #3d3b38;
    --nut-so-chu: #f2ede4;
    --nut-so-hover: #4a4844;
    --nut-toan-tu: #cf9a3e;
    --nut-toan-tu-hover: #e0ab4f;
    --nut-xoa: #a8503a;
    --nut-xoa-hover: #bd5e46;
    --nut-bang: #6f8f6b;
    --nut-bang-hover: #7fa07a;
  }

  *{ box-sizing: border-box; }

  html, body{
    margin: 0;
    height: 100%;
  }

  body{
    background: var(--nen-trang);
    font-family: "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
  }

  .may-tinh{
    background: linear-gradient(180deg, var(--vo-may), var(--vo-may-toi));
    border-radius: 22px;
    padding: 22px;
    width: 320px;
    box-shadow: 0 20px 45px rgba(32,31,29,0.35), 0 2px 0 rgba(255,255,255,0.04) inset;
  }

  .nhan{
    color: #a89f8f;
    font-size: 0.72rem;
    letter-spacing: 1.5px;
    margin: 0 4px 14px;
  }

  .man-hinh{
    background: var(--man-hinh);
    border-radius: 12px;
    padding: 26px 18px;
    margin-bottom: 18px;
    box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
  }

  #bieu-thuc{
    color: #7a7266;
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 0.85rem;
    min-height: 18px;
    text-align: right;
    margin-bottom: 6px;
    overflow-x: auto;
    white-space: nowrap;
  }

  #man-hinh-hien-thi{
    color: var(--chu-man-hinh);
    font-family: "SFMono-Regular", Consolas, "Courier New", monospace;
    font-size: 2.2rem;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
  }

  .luoi-nut{
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }

  button{
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 1.15rem;
    padding: 16px 0;
    cursor: pointer;
    transition: transform 0.08s ease, background-color 0.2s ease;
    box-shadow: 0 2px 0 rgba(0,0,0,0.18);
  }

  button:active{
    transform: translateY(2px);
    box-shadow: none;
  }

  .nut-so{
    background: var(--nut-so);
    color: var(--nut-so-chu);
  }
  .nut-so:hover{ background: var(--nut-so-hover); }

  .nut-toan-tu{
    background: var(--nut-toan-tu);
    color: #2b2a28;
    font-weight: 600;
  }
  .nut-toan-tu:hover{ background: var(--nut-toan-tu-hover); }

  .nut-xoa{
    background: var(--nut-xoa);
    color: #f2ede4;
    font-weight: 600;
  }
  .nut-xoa:hover{ background: var(--nut-xoa-hover); }

  .nut-bang{
    background: var(--nut-bang);
    color: #1c1b19;
    font-weight: 600;
  }
  .nut-bang:hover{ background: var(--nut-bang-hover); }

  .rong-2{
    grid-column: span 2;
  }
</style>
</head>
<body>

  <div class="may-tinh">
    <p class="nhan">MÁY TÍNH ĐƠN GIẢN</p>

    <div class="man-hinh">
      <div id="bieu-thuc">&nbsp;</div>
      <div id="man-hinh-hien-thi">0</div>
    </div>

    <div class="luoi-nut">
      <button class="nut-xoa rong-2" data-loai="xoa">Clear</button>
      <button class="nut-toan-tu" data-loai="toan-tu" data-gia-tri="/">÷</button>
      <button class="nut-toan-tu" data-loai="toan-tu" data-gia-tri="*">×</button>

      <button class="nut-so" data-loai="so" data-gia-tri="7">7</button>
      <button class="nut-so" data-loai="so" data-gia-tri="8">8</button>
      <button class="nut-so" data-loai="so" data-gia-tri="9">9</button>
      <button class="nut-toan-tu" data-loai="toan-tu" data-gia-tri="-">−</button>

      <button class="nut-so" data-loai="so" data-gia-tri="4">4</button>
      <button class="nut-so" data-loai="so" data-gia-tri="5">5</button>
      <button class="nut-so" data-loai="so" data-gia-tri="6">6</button>
      <button class="nut-toan-tu" data-loai="toan-tu" data-gia-tri="+">+</button>

      <button class="nut-so" data-loai="so" data-gia-tri="1">1</button>
      <button class="nut-so" data-loai="so" data-gia-tri="2">2</button>
      <button class="nut-so" data-loai="so" data-gia-tri="3">3</button>
      <button class="nut-bang" data-loai="bang" style="grid-row: span 2;">=</button>

      <button class="nut-so rong-2" data-loai="so" data-gia-tri="0">0</button>
      <button class="nut-so" data-loai="cham" data-gia-tri=".">.</button>
    </div>
  </div>

<script>
  const manHinh = document.getElementById("man-hinh-hien-thi");
  const dongBieuThuc = document.getElementById("bieu-thuc");
  const tatCaNut = document.querySelectorAll("button");

  let daTinhXong = false; // đánh dấu vừa bấm "=" xong hay chưa

  tatCaNut.forEach(function (nut) {
    nut.addEventListener("click", function () {
      const loai = nut.dataset.loai;
      const giaTri = nut.dataset.giaTri;

      if (loai === "so" || loai === "cham") {
        xuLySo(giaTri);
      } else if (loai === "toan-tu") {
        xuLyToanTu(giaTri);
      } else if (loai === "xoa") {
        xoaManHinh();
      } else if (loai === "bang") {
        tinhKetQua();
      }
    });
  });

  // ----- Bấm số hoặc dấu chấm: nối vào màn hình -----
  function xuLySo(kyTu) {
    if (daTinhXong) {
      // vừa ra kết quả, bấm số mới thì bắt đầu lại
      manHinh.innerText = "0";
      dongBieuThuc.innerText = "";
      daTinhXong = false;
    }

    if (manHinh.innerText === "0" && kyTu !== ".") {
      manHinh.innerText = kyTu;
    } else {
      manHinh.innerText = manHinh.innerText + kyTu;
    }
  }

  // ----- Bấm toán tử: đưa số hiện tại vào biểu thức -----
  function xuLyToanTu(toanTu) {
    daTinhXong = false;
    const kyTuCuoi = dongBieuThuc.innerText.trim().slice(-1);

    if (dongBieuThuc.innerText.trim() === "") {
      dongBieuThuc.innerText = manHinh.innerText + " " + toanTu + " ";
    } else if ("+-*/".includes(kyTuCuoi)) {
      // đổi toán tử vừa nhập thay vì cộng thêm
      dongBieuThuc.innerText = dongBieuThuc.innerText.trim().slice(0, -1) + toanTu + " ";
    } else {
      dongBieuThuc.innerText = dongBieuThuc.innerText + manHinh.innerText + " " + toanTu + " ";
    }

    manHinh.innerText = "0";
  }

  // ----- Bấm Clear: đặt lại màn hình về 0 -----
  function xoaManHinh() {
    manHinh.innerText = "0";
    dongBieuThuc.innerText = "";
    daTinhXong = false;
  }

  // ----- Bấm =: tính toán biểu thức hiện có -----
  function tinhKetQua() {
    const bieuThucDayDu = (dongBieuThuc.innerText + manHinh.innerText).trim();

    // chỉ cho phép số, dấu chấm, khoảng trắng và 4 phép toán để an toàn khi tính
    if (!/^[0-9+\-*/.\s]+$/.test(bieuThucDayDu) || bieuThucDayDu === "") {
      manHinh.innerText = "Lỗi";
      dongBieuThuc.innerText = "";
      daTinhXong = true;
      return;
    }

    try {
      const ketQua = Function('"use strict"; return (' + bieuThucDayDu + ')')();

      if (!isFinite(ketQua)) {
        manHinh.innerText = "Lỗi";
      } else {
        // làm tròn để tránh sai số dấu phẩy động, tối đa 8 chữ số thập phân
        manHinh.innerText = String(Math.round(ketQua * 1e8) / 1e8);
      }

      dongBieuThuc.innerText = bieuThucDayDu + " =";
      daTinhXong = true;
    } catch (loi) {
      manHinh.innerText = "Lỗi";
      dongBieuThuc.innerText = "";
      daTinhXong = true;
    }
  }
</script>

</body>
</html>
